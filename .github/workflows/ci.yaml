name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify index.html exists
        run: |
          if [ ! -f public/index.html ]; then
            echo "❌ index.html not found!"
            exit 1
          fi

      - name: Verify style.css exists
        run: |
          if [ ! -f public/style.css ]; then
            echo "❌ style.css not found!"
            exit 1
          fi

      - name: Verify script.js exists
        run: |
          if [ ! -f public/script.js ]; then
            echo "❌ script.js not found!"
            exit 1
          fi

      - name: Show repository structure
        run: ls -R

      - name: Success
        run: echo "✅ Portfolio validation passed!"